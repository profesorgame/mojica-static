<script>
  /* before first paint: restore the visitor's choice; dark is the default (David). Shared with the CV via the same key */
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = "dark";
    var d = document.documentElement;
    d.dataset.theme = t;
    d.classList.add("js", "fl");
    /* hold the identity plane (visibility only, no layout cost) for the few ms the
       embedded font takes to decode, so nothing ever lays out in a fallback face */
    function ready() { requestAnimationFrame(function () { requestAnimationFrame(function () { d.classList.remove("fl"); }); }); }
    setTimeout(ready, 1500);
    if (document.fonts && document.fonts.load) document.fonts.load('700 1em "Roboto Mono"').then(ready, ready);
    /* arriving through a cross-document view transition: the new page's snapshot must include the plane */
    addEventListener("pagereveal", function (e) { if (e.viewTransition) d.classList.remove("fl"); });
  })();
</script>

/* metric-matched fallback: every face here advances 0.6em, like Roboto Mono, so the
   few ms before the embedded font is decoded never re-flow anything */
@font-face { font-family: "RM Fallback"; src: local("Menlo"), local("Liberation Mono"), local("Courier New"), local("Cousine"), local("DejaVu Sans Mono"); }

/* ---------------------------------------------------------------- tokens
   Brand authority: the pre-AI originals (docs/brand-originals/).
   Dark = the 2015 landing's gray-900; light = the 2022 CV's blue.
   The identity plane is always the other world. */
:root {
  color-scheme: dark;
  --ground: #111827;
  --plane: #cae7ff;
  --plane-ink: #050a30;
  --plane-ink-2: #364164;
  --btn-bg: #050a30;
  --btn-ink: #cae7ff;
  --control: #cae7ff;
  --coral: #f16476;
  --orchid: #eb83f8;
  --mint: #83f09a;
  --ring: #cae7ff;
  --pad: clamp(.75rem, min(4vw, 5.5vh), 3.5rem); /* scales with height too: the poster fits one screen */
}
html[data-theme="light"] {
  color-scheme: light;
  --ground: #cae7ff;
  --plane: #050a30;
  --plane-ink: #ffffff;
  --plane-ink-2: #cae7ff;
  --btn-bg: #cae7ff;
  --btn-ink: #050a30;
  --control: #050a30;
  --coral: #d6405a;
  --orchid: #9b3fc0;
  --mint: #050a30;
  --ring: #050a30;
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; margin: 0; padding: 0; }
.defs { position: absolute; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* very large screens: the whole rem scale grows with the viewport, so the plane keeps its share of the poster */
@media (min-width: 1800px) and (min-height: 900px) { html { font-size: clamp(100%, min(1.111vw, 1.778vh), 150%); } }
body {
  font-family: "Roboto Mono", "RM Fallback", monospace;
  font-synthesis: none;
  line-height: 1.5;
  font-weight: 400;
  background: var(--ground);
  color: var(--plane-ink);
  overflow-x: clip;
  caret-color: var(--plane-ink);
  accent-color: var(--plane-ink);
}
::selection { background: var(--plane-ink); color: var(--plane); }
:focus-visible { outline: 2px solid var(--control); outline-offset: 3px; }
.plane :focus-visible { outline-color: var(--plane-ink); }

/* ---------------------------------------------------------------- poster */
.poster {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  padding: clamp(.5rem, 6vh, 7rem) 0;
  isolation: isolate;
  overflow-x: clip;
}

/* the field: David's original figures, still, bleeding off every edge */
.field { position: absolute; inset: 0; overflow: hidden; z-index: -1; }
.fig { position: absolute; display: block; overflow: visible; }
/* the 2015 landing's move-up / move-down, toned down: each figure on its own cycle */
.field .fig {
  animation: bob var(--t, 7s) ease-in-out var(--d, 0s) infinite alternate;
  transition: transform .6s cubic-bezier(.16, 1, .3, 1);
}
@keyframes bob { from { translate: 0 calc(var(--a, 10px) * -1); } to { translate: 0 var(--a, 10px); } }
.f-disc   { --a: 12px; --t: 7s;   --d: -1s; }
.f-ring   { --a: 10px; --t: 9s;   --d: -4s; }
.f-plus1  { --a: 14px; --t: 5s;   --d: -2s; }
.f-plus2  { --a: 9px;  --t: 6.5s; --d: -5s; }
.f-plus3  { --a: 12px; --t: 5.5s; --d: -3s; }
.f-tri    { --a: 11px; --t: 8s;   --d: -6s; }
.f-disc2  { --a: 13px; --t: 6s;   --d: -2.5s; }
.f-ring2  { --a: 8px;  --t: 8.5s; --d: -1.5s; }
.f-stairs { --a: 10px; --t: 7.5s; --d: -3.5s; }
.coral { color: var(--coral); }
.orchid { color: var(--orchid); }
.mint { color: var(--mint); }
.ring { color: var(--ring); }

.f-disc   { width: min(36vw, 58vh); left: -9vw;  top: -16vh; }
.f-ring   { width: min(22vw, 36vh); right: 9vw;   top: 6vh; }
.f-plus1  { width: min(6vw, 10vh);  left: 56vw;  top: 15vh; }
.f-plus2  { width: min(10vw, 16vh); right: -3vw;  top: 50vh; }
.f-plus3  { width: min(4vw, 6vh);   left: 52vw;  bottom: 5vh; }
.f-tri    { width: min(22vw, 36vh); left: -5vw;  bottom: -12vh; }
.f-disc2  { width: min(20vw, 32vh); right: 13vw; bottom: -11vh; }
.f-ring2  { width: min(13vw, 21vh); right: -4vw; bottom: 6vh; }
.f-stairs { width: min(18vw, 30vh); left: 57vw;  top: 44vh; }

@media (min-width: 1600px) {
  .f-ring { width: 22vw; } .f-stairs { width: 18vw; left: 53vw; } .f-plus1 { width: 6vw; left: 47vw; } .f-plus3 { left: 44vw; }
}

/* the identity plane: one flat colour field inside the poster */
.fl .plane-wrap { visibility: hidden; }
.plane-wrap {
  position: relative;
  z-index: 1;
  margin-left: clamp(1rem, 9vw, 14rem);
  width: fit-content;
  max-width: calc(100vw - 2rem);
}
.plane {
  position: relative;
  background: var(--plane);
  padding: var(--pad) calc(var(--pad) * 1.75) var(--pad) var(--pad);
}
/* figures locked to the plane's edges; they live in its padding, never on text */
.edge { position: absolute; pointer-events: none; }
.e-stairs { width: calc(var(--pad) * 2.6); right: calc(var(--pad) * -1.3); top: 30%; z-index: 2; }
.e-plus   { width: calc(var(--pad) * 1.5); left: calc(var(--pad) * -1.05); bottom: calc(var(--pad) * -.3); z-index: 2; } /* bites the left edge, two-thirds on the ground */
/* edge figures move only along the edge they bite, never toward the text */
.edge { transition: transform .6s cubic-bezier(.16, 1, .3, 1); }
.e-tri    { --axis: x; animation: slide-x 9s ease-in-out -2s infinite alternate; }
.e-stairs { --axis: y; animation: slide-y 8s ease-in-out -5s infinite alternate; }
.e-plus   { --axis: r; animation: wobble 11s ease-in-out -3s infinite alternate; }
@keyframes slide-x { from { translate: -10px 0; } to { translate: 10px 0; } }
@keyframes slide-y { from { translate: 0 -8px; } to { translate: 0 8px; } }
@keyframes wobble { from { rotate: -8deg; } to { rotate: 8deg; } }
.e-tri    { width: calc(var(--pad) * 3.4); right: 18%; top: calc(var(--pad) * -2.2); z-index: -1; }

/* ---------------------------------------------------------------- type */
h1 { font-weight: 700; }
.hello {
  display: block;
  font-weight: 400;
  font-size: clamp(.8125rem, min(1.25vw, 2.2vh), 1.25rem);
  line-height: 1.4;
  height: 1.4em; /* fixed line box: the typing never moves the name */
  margin-bottom: clamp(.15em, 1vh, .6em);
}
.type {
  display: inline-block;
  vertical-align: top;
  height: 1.4em;
  white-space: nowrap;
  overflow: hidden;
  width: calc(10ch + .15em); /* 10 chars plus subpixel slack */
  border-right: .09em solid transparent;
  animation: type .6s steps(10, end) .2s both, caret 1s steps(1, end) .2s 7; /* slow blink, lingers ~7s */
}
@keyframes type { from { width: 0; } to { width: calc(10ch + .15em); } }
@keyframes caret { 0% { border-right-color: currentColor; } 50% { border-right-color: transparent; } }
.name {
  display: block;
  font-size: clamp(1.75rem, min(6.5vw, 10vh), 6rem);
  line-height: .95;
  letter-spacing: -.02em;
  text-transform: uppercase;
}
.name > span { display: block; }
.headline {
  margin-top: clamp(.4rem, min(2vw, 2.6vh), 1.6rem);
  font-weight: 500;
  font-size: clamp(.875rem, min(1.5vw, 2.45vh), 1.375rem);
  line-height: 1.3;
  letter-spacing: -.01em;
}
.headline > span:not(.sr) { display: block; white-space: nowrap; } /* one discipline per line, never split */
.facts {
  list-style: none;
  margin-top: clamp(.4rem, min(1.6vw, 2vh), 1.25rem);
  color: var(--plane-ink-2);
  font-size: clamp(.8125rem, min(1.1vw, 2vh), 1.125rem);
  line-height: clamp(1.35, .9 + 1vh, 1.6);
}
.actions {
  margin-top: clamp(.5rem, min(2.4vw, 3vh), 1.875rem);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: .75rem 1.5rem;
}
.email {
  display: inline-block;
  white-space: nowrap;
  padding: .75em 1.25em;
  border: 2px solid var(--btn-bg);
  background: var(--btn-bg);
  color: var(--btn-ink);
  font-weight: 500;
  font-size: clamp(.8125rem, 2.2vh, 1rem);
  line-height: 1.5;
  text-decoration: none;
  transition: background-color .12s, color .12s;
}
.email:hover { background: transparent; color: var(--plane-ink); }
.linkedin {
  display: inline-flex;
  align-items: center;
  gap: .35em;
  min-height: 2.25rem;
  color: var(--plane-ink);
  font-size: clamp(.8125rem, 2.2vh, 1rem);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: .22em;
  transition: text-decoration-thickness .12s;
}
.linkedin:hover { text-decoration-thickness: 3px; }
.linkedin svg { width: .8em; height: .8em; }

/* ---------------------------------------------------------------- theme control */
.theme {
  display: none;
  position: absolute;
  z-index: 3;
  top: 16px;
  right: 16px;
  width: 2.5rem;
  height: 2.5rem;
  padding: .45rem;
  color: var(--control);
  background: var(--ground);
  border: 2px solid var(--control);
  cursor: pointer;
}
.theme svg { display: block; width: 100%; height: 100%; transition: rotate .3s cubic-bezier(.16, 1, .3, 1); }
.theme:hover svg { rotate: 180deg; }
.js .theme { display: block; }
/* break-apart control: the theme control's twin, one slot to its left */
.shatter {
  display: none; position: absolute; z-index: 3; top: 16px; right: calc(16px + 2.5rem + 8px);
  width: 2.5rem; height: 2.5rem; padding: .45rem;
  color: var(--control); background: var(--ground); border: 2px solid var(--control); cursor: pointer;
}
.shatter svg { display: block; width: 100%; height: 100%; }
.shatter:hover, html[data-broken] .shatter { background: var(--control); color: var(--ground); }
.js .shatter { display: block; }
/* broken figures: strips in a fixed layer behind the plane; ambient motion paused */
.shards { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.shards.front { z-index: 2; } /* inside .plane-wrap: the pieces of the figures that sit in front of the plane stay in front */
.shards .shard-fig { position: fixed; transform-origin: 50% 50%; }
.shards .shard-fig > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; margin: 0; }
html[data-broken] .field .fig, html[data-broken] .edge { animation-play-state: paused; }
.nw { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------------------------------------------------------------- narrow / short: band layout */
@media (max-width: 599px) and (min-height: 561px), (max-width: 899px) and (orientation: portrait) and (min-height: 561px) {
  .poster { display: block; padding: clamp(5rem, 22svh, 12rem) 16px clamp(1rem, 4svh, 3.5rem); }
  .plane-wrap { margin: 0; width: auto; }
  .plane { padding: clamp(1rem, 3svh, 1.5rem) clamp(1rem, 4vw, 1.5rem) clamp(1rem, 3.2svh, 1.75rem); }
  .plane-wrap { max-width: none; }

/* 404: the intact poster holds still, then breaks once */
.field .fig, .edge { animation: none !important; }

/* ---------------------------------------------------------------- page transitions
   Same-origin navigations (the 404's "Back to homepage") morph: the plane resizes into the
   homepage's plane, the figures keep their places. Browsers without support just navigate. */
@view-transition { navigation: auto; }
.plane { view-transition-name: plane; }
.f-disc { view-transition-name: f-disc; } .f-ring { view-transition-name: f-ring; } .f-plus1 { view-transition-name: f-plus1; }
.f-plus2 { view-transition-name: f-plus2; } .f-plus3 { view-transition-name: f-plus3; } .f-tri { view-transition-name: f-tri; }
.f-disc2 { view-transition-name: f-disc2; } .f-ring2 { view-transition-name: f-ring2; } .f-stairs { view-transition-name: f-stairs; }
.e-tri { view-transition-name: e-tri; } .e-stairs { view-transition-name: e-stairs; } .e-plus { view-transition-name: e-plus; }
::view-transition-group(*) { animation-duration: .55s; animation-timing-function: cubic-bezier(.16, 1, .3, 1); }
/* the plane grows instead of stretching: snapshots keep their size, anchored top-left, clipped to the growing box */
::view-transition-group(plane) { overflow: clip; }
::view-transition-old(plane), ::view-transition-new(plane) { width: auto; height: auto; object-fit: none; object-position: 0 0; }
@media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }

/* ---------------------------------------------------------------- motion off */
@media (prefers-reduced-motion: reduce) {
  .type { animation: none; }
  .field .fig, .edge { animation: none; transition: none; }

<body>
<!-- figure geometry: redrawn from the original 2015 landing PNGs and the 2022 CV vectors -->
<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">

<script>
  (function () {
    var d = document.documentElement, m = document.querySelector('meta[name="theme-color"]');
    if (d.dataset.theme === "light") m.content = "#cae7ff";

    /* break apart: every figure is sliced into strips that fall behind the plane; press again to rebuild */
    var sb = document.querySelector(".shatter"), poster = document.querySelector(".poster");
    var rmq = matchMedia("(prefers-reduced-motion: reduce)"), layer = null, front = null, anims = [], hidden = [], broken = false;
    var wrap = document.querySelector(".plane-wrap");
    function name() {}
    function cleanup() {
      anims.forEach(function (a) { a.cancel(); }); anims = [];
      if (layer) { layer.remove(); layer = null; }
      if (front) { front.remove(); front = null; }
      hidden.forEach(function (f) { f.style.visibility = ""; }); hidden = [];
      delete d.dataset.broken; broken = false; name();
    }
    function shatter() {
      broken = true; d.dataset.broken = ""; name();
      layer = document.createElement("div"); layer.className = "shards"; layer.setAttribute("aria-hidden", "true");
      poster.insertBefore(layer, poster.firstChild);
      front = layer.cloneNode(false); front.classList.add("front"); wrap.appendChild(front);
      var W = innerWidth, H = innerHeight, rm = false;
      /* text, button and link boxes: a front piece whose whole path stays clear of them may fall in front */
      var text = [].map.call(document.querySelectorAll(".plane .type, .plane .name span, .headline span, .facts li, .email, .linkedin"), function (e) { return e.getBoundingClientRect(); });
      function clear(a) { return text.every(function (t) { return a.r <= t.left || a.l >= t.right || a.b <= t.top || a.t >= t.bottom; }); }
      [].forEach.call(document.querySelectorAll(".field .fig, .edge"), function (f, i) {
        if (getComputedStyle(f).display === "none") return;
        /* copy the figure's exact state (frozen ambient translate/rotate + pointer nudge) onto a wrapper,
           so the last frame of a rebuild lands pixel-true on the real figure */
        var cs = getComputedStyle(f), tr = cs.translate, ro = cs.rotate, tf = f.style.transform;
        f.style.setProperty("transition", "none", "important");
        ["translate", "rotate", "transform"].forEach(function (p) { f.style.setProperty(p, "none", "important"); });
        var r = f.getBoundingClientRect();
        f.style.removeProperty("translate"); f.style.removeProperty("rotate"); f.style.removeProperty("transform");
        f.style.transform = tf; f.getBoundingClientRect(); f.style.removeProperty("transition");
        hidden.push(f); f.style.visibility = "hidden";
        if (r.bottom < 0 || r.top > H || r.right < 0 || r.left > W) return;
        var colour = (f.getAttribute("class").match(/\b(coral|orchid|mint|ring)\b/) || [""])[0];
        var cls = f.getAttribute("class"), inFront = /e-stairs|e-plus/.test(cls), out = /e-stairs/.test(cls) ? 1 : /e-plus/.test(cls) ? -1 : 0;
        var n = Math.max(3, Math.min(7, Math.round(r.height / 40))), sh = r.height / n, delay = Math.random() * 250, wraps = {};
        function holder(into) {
          var key = into === front ? "f" : "b";
          if (!wraps[key]) {
            var w = document.createElement("div"); w.className = "shard-fig " + colour;
            w.style.cssText = "left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;translate:" + tr + ";rotate:" + ro + ";transform:" + (tf || "none");
            into.appendChild(w); wraps[key] = w;
          }
          return wraps[key];
        }
        for (var k = 0; k < n; k++) {
          var c = f.cloneNode(true);
          c.removeAttribute("class");
          c.style.cssText = "visibility:visible;clip-path:inset(" + (k * 100 / n) + "% 0 " + ((n - k - 1) * 100 / n) + "% 0);transform-origin:50% " + ((k + .5) * 100 / n) + "%";
          var top = r.top + k * sh, floor = H - sh * (.25 + Math.random() * .6);
          var dy = floor - (top + sh), cx = r.left + r.width / 2;
          var dx = out ? out * Math.random() * 50 : (Math.random() - .5) * 120;
          dx = Math.max(-cx + 20, Math.min(W - 20 - cx, dx));
          /* the strip's swept box (start to rest, padded for the spin) decides its layer */
          var m = Math.max(r.width, sh) / 2, x0 = r.left, x1 = r.left + dx;
          var swept = { l: Math.min(x0, x1) - m * .3, r: Math.max(x0, x1) + r.width + m * .3, t: top - m * .3, b: top + sh + Math.max(dy, 0) + m * .3 };
          holder(inFront && clear(swept) ? front : layer).appendChild(c);
          if (rm) { anims.push(c.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" })); continue; }
          var rot = (Math.random() < .5 ? -1 : 1) * (20 + Math.random() * 140);
          anims.push(c.animate([
            { transform: "translate(0,0) rotate(0deg)", easing: "cubic-bezier(.45,0,1,1)" },
            { transform: "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg)", offset: .8, easing: "ease-out" },
            { transform: "translate(" + dx + "px," + (dy - Math.min(18, sh * .4)) + "px) rotate(" + rot * 1.04 + "deg)", offset: .9, easing: "ease-in" },
            { transform: "translate(" + dx + "px," + dy + "px) rotate(" + rot * 1.05 + "deg)" }
          ], { duration: 900 + Math.random() * 600, delay: delay + k * 30, fill: "both" }));
        }
      });
    }
    /* a broken link: break once, 700ms after the plane appears, and stay down */
    /* every load starts whole and breaks once; reduced motion: nothing happens, the figures stay whole */
    function go() { shatter(); }
    if (!rmq.matches) (function ready() { if (d.classList.contains("fl")) return requestAnimationFrame(ready); setTimeout(go, 700); })();
    addEventListener("resize", function () { if (layer) { cleanup(); shatter(); anims.forEach(function (a) { a.finish(); }); } });
    /* "Back to homepage": first the pieces fly back (the link gets fixed), then the page morphs into the homepage */
    var back = document.querySelector(".plane .email"), leaving = false;
    back.addEventListener("click", function (e) {
      if (rmq.matches || !layer || leaving || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
      e.preventDefault(); leaving = true;
      function home() { if (!leaving) return; leaving = false; cleanup(); location.href = back.href; }
      anims.forEach(function (a) { a.playbackRate = -2.6; a.play(); }); /* finished animations need play() to run again */
      Promise.all(anims.map(function (a) { return a.finished; })).then(home, home);
      setTimeout(home, 1400); /* never keep the visitor waiting */
    });

  })();
</script>
